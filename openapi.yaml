openapi: 3.0.3
info:
  title: Tethr API
  version: 0.1.0
  description: |
    Tethr's own API: accounts, households and, soon, everything players need to log what people watch.

    Signing in works without passwords. Ask for a sign-in email, then exchange the link's token, or the email address and the 6-digit code, for a session. The session lives in an HTTP-only cookie, so browsers send it with `credentials: 'include'`.

    Errors come back as `{"code": "...", "message": "..."}`. `code` is stable for programs to check, and `message` is written for people.

    Apps sign in on someone's behalf with OAuth: TVs show a code that people enter at `/activate` on the website, and phones and computers send them to `/oauth/authorize` in a browser. Each connection logs to one profile the person chooses. Send the access token as `Authorization: Bearer ...` to the tracking endpoints: scrobble, Up next, history, playback, the watchlist, ratings, imports and activity.

    Players built for the Trakt API can use the paths they already know instead, at the same address.
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: https://api.tethr.tv
  - url: https://staging-api.tethr.tv
paths:
  /v1/accounts:
    post:
      operationId: createAccount
      summary: Start a sign-up by emailing a sign-in link
      description: Always answers 202 for an email address that already has an account, so the endpoint can't be used to find out who has signed up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUp'
      responses:
        '202':
          description: A sign-in link and code are on their way
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/email-link:
    post:
      operationId: requestEmailLink
      summary: Email a sign-in link and code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailLinkRequest'
      responses:
        '202':
          description: If the address has an account, a sign-in link and code are on their way
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/verify:
    post:
      operationId: verify
      summary: Exchange a link token, or an email and code, for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verification'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/sign-out:
    post:
      operationId: signOut
      summary: End the current session
      responses:
        '204':
          description: Signed out
          headers:
            Set-Cookie:
              schema:
                type: string
  /v1/auth/passkey/options:
    post:
      operationId: passkeySignInOptions
      summary: Start signing in with a passkey
      responses:
        '200':
          description: Options to pass to the browser's WebAuthn API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
  /v1/auth/passkey:
    post:
      operationId: passkeySignIn
      summary: Finish signing in with a passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Problem'
  /v1/passkeys:
    get:
      operationId: listPasskeys
      summary: The signed-in account's passkeys
      security:
        - session: []
      responses:
        '200':
          description: Passkeys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Passkey'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: addPasskey
      summary: Finish adding a passkey
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/passkeys/options:
    post:
      operationId: addPasskeyOptions
      summary: Start adding a passkey
      security:
        - session: []
      responses:
        '200':
          description: Options to pass to the browser's WebAuthn API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/passkeys/{id}:
    delete:
      operationId: removePasskey
      summary: Remove a passkey
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/profiles:
    post:
      operationId: addProfile
      summary: Add someone to the household
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProfile'
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/profiles/{id}:
    patch:
      operationId: updateProfile
      summary: Rename a profile, change its username or privacy
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileChanges'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeProfile
      summary: Remove someone from the household, and their history
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/sessions:
    get:
      operationId: listSessions
      summary: Where the account is signed in
      security:
        - session: []
      responses:
        '200':
          description: Sessions, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/sessions/{id}:
    delete:
      operationId: endSession
      summary: Sign out one device
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/sessions/sign-out-others:
    post:
      operationId: signOutOthers
      summary: Sign out everywhere except here
      security:
        - session: []
      responses:
        '204':
          description: Signed out elsewhere
        '401':
          $ref: '#/components/responses/Problem'
  /v1/me:
    delete:
      operationId: deleteAccount
      summary: Delete the account, its household and everything in it
      description: Send the owner's username to confirm. This can't be undone.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        '204':
          description: Deleted
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    get:
      operationId: getMe
      summary: The signed-in account and its household's profiles
      security:
        - session: []
      responses:
        '200':
          description: The signed-in account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/devices/{code}:
    get:
      operationId: getDevice
      summary: Look up a code shown on a TV or other device
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/DeviceCode'
      responses:
        '200':
          description: The code is waiting for approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/devices/{code}/approve:
    post:
      operationId: approveDevice
      summary: Connect the device to one of your profiles
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/DeviceCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileChoice'
      responses:
        '204':
          description: Approved; the device picks up its tokens on its next poll
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/devices/{code}/deny:
    post:
      operationId: denyDevice
      summary: Turn the device away
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/DeviceCode'
      responses:
        '204':
          description: Denied
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/authorize:
    get:
      operationId: getAuthorization
      summary: Check an app's sign-in request before asking the person
      security:
        - session: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The app and redirect are known
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizingApp'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: authorize
      summary: Approve an app's sign-in request for one of your profiles
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
      responses:
        '200':
          description: Send the browser to `redirect_to`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationRedirect'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/connections:
    get:
      operationId: listConnections
      summary: List the apps connected to your household
      security:
        - session: []
      responses:
        '200':
          description: Connected apps, most recently used first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/connections/{id}:
    patch:
      operationId: renameConnection
      summary: Give a connected app a name, like "Living room"
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionChanges'
      responses:
        '204':
          description: Renamed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: disconnect
      summary: Disconnect an app
      description: Its tokens stop working at once. History it logged stays.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Disconnected
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/profile:
    get:
      operationId: getProfile
      summary: The profile you're logging to
      security:
        - session: []
        - bearer: []
      responses:
        '200':
          description: For an app, the profile it was connected to. For the website, your own.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/scrobble:
    post:
      operationId: scrobble
      summary: Report playback starting, pausing or stopping
      description: Send `start` when playback begins or resumes, `pause` when it pauses, and `stop` when it ends. A stop at 80% or more logs a watch and clears the resume point; a stop below that keeps a resume point instead.
      security:
        - session: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrobbleRequest'
      responses:
        '200':
          description: What Tethr did with it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrobbleResult'
        '401':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/history:
    get:
      operationId: listHistory
      summary: Watches, newest first
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, episode]
        - name: title_id
          in: query
          description: Only watches of this film or show.
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        '200':
          description: A page of watches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: addHistory
      summary: Log watches that happened elsewhere
      description: Films and episodes only. A watch already logged for the same item at the same time is skipped.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWatches'
      responses:
        '200':
          description: What was added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '401':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/history/{id}:
    delete:
      operationId: removeWatch
      summary: Remove one watch
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/playback:
    get:
      operationId: listPlayback
      summary: Resume points, most recent first
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, episode]
      responses:
        '200':
          description: Resume points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResumePoint'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/playback/{id}:
    delete:
      operationId: removePlayback
      summary: Forget a resume point
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/watchlist:
    get:
      operationId: listWatchlist
      summary: The watchlist, in order
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, show, season, episode]
      responses:
        '200':
          description: Watchlist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: addToWatchlist
      summary: Add to the watchlist
      description: Watching a film or episode takes it off the watchlist by itself.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewListings'
      responses:
        '200':
          description: What was added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '401':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/watchlist/{id}:
    delete:
      operationId: removeFromWatchlist
      summary: Take one entry off the watchlist
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/activity:
    get:
      operationId: getActivity
      summary: When history, playback and the watchlist last changed
      description: Cheap to call. Poll this and only fetch the lists whose time has moved on.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Latest change times
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/up-next:
    get:
      operationId: getUpNext
      summary: The next episode of every show you're partway through
      description: The first aired, unwatched episode after the latest one watched, or the earliest gap if there's nothing later. Specials and episodes that haven't aired are skipped, and so are hidden shows. Most recently watched shows come first. Shows appear once Tethr has their episode list, usually within a minute of the first watch.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: One entry per show
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpNextEntry'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/up-next/hidden/{id}:
    put:
      operationId: hideFromUpNext
      summary: Hide a show from Up next
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Hidden
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: showInUpNext
      summary: Put a hidden show back in Up next
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Back in Up next
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/ratings:
    get:
      operationId: listRatings
      summary: Ratings, newest first
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, show, season, episode]
        - name: rating
          in: query
          description: Only these ratings.
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 10
          explode: false
      responses:
        '200':
          description: Ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rating'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: rate
      summary: Rate films, shows, seasons or episodes from 1 to 10
      description: Rating something again replaces the old rating. The same score again counts as existing.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRatings'
      responses:
        '200':
          description: What was rated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '401':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/ratings/{id}:
    delete:
      operationId: removeRating
      summary: Remove one rating
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/imports:
    get:
      operationId: listImports
      summary: The last 20 imports
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Imports, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Import'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createImport
      summary: Read a Trakt export before importing it
      description: |
        Send the zip from Trakt's data export as the body. Tethr reads history, the watchlist, resume points, ratings and hidden items, and keeps them for 24 hours. Nothing is written until the import is applied, so check the counts and the unmatched list first. Everything else in the zip is ignored.

        Items are matched by their TMDB, IMDb and TVDB IDs. Anything without one of those is listed as unmatched rather than guessed. Plays already in history at the same time are skipped, so importing the same file twice is safe.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - name: filename
          in: query
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: The import, ready to apply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
  /v1/imports/{id}:
    get:
      operationId: getImport
      summary: One import and its counts
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: The import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/imports/{id}/apply:
    post:
      operationId: applyImport
      summary: Write an import into the profile
      description: Imports run in the background, one at a time. Poll the import until its status is `applied` or `failed`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/imports/{id}/undo:
    post:
      operationId: undoImport
      summary: Take out everything an import added
      description: Works for 30 days after an import is applied. Plays, ratings and watchlist entries that were already there before the import stay.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Undone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/apps:
    get:
      operationId: listApps
      summary: Apps you've registered
      security:
        - session: []
      responses:
        '200':
          description: Your apps, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeveloperApp'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: registerApp
      summary: Register an app to get a client ID
      description: The secret comes back once. Leave out `redirect_uris` for apps that only sign in with TV codes.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewApp'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredApp'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/apps/{id}:
    patch:
      operationId: updateApp
      summary: Rename an app or change where sign-in returns to
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppChanges'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperApp'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: revokeApp
      summary: Revoke an app
      description: Everyone signed in with it is signed out, and its client ID stops working. History it logged stays.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/apps/{id}/secret:
    post:
      operationId: newAppSecret
      summary: Replace an app's secret
      description: The old secret stops working at once. People stay signed in.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The new secret, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSecret'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /oauth/device/code:
    post:
      tags: [oauth]
      operationId: startDeviceSignIn
      summary: Start signing in a TV or other device
      description: Show `user_code` and `verification_url` to the person, then poll `/oauth/device/token` every `interval` seconds. Errors from the `/oauth` endpoints use OAuth's shape, with `error` and `error_description`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id:
                  type: string
      responses:
        '200':
          description: A code to show
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSignIn'
        '403':
          $ref: '#/components/responses/OAuthError'
  /oauth/device/token:
    post:
      tags: [oauth]
      operationId: pollDeviceSignIn
      summary: Check whether the code has been approved
      description: 400 means keep waiting, 429 means slow down, 404 the code is unknown, 409 it's been used, 410 it's expired and 418 it was denied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, client_id]
              properties:
                code:
                  type: string
                  description: The `device_code`, not the code the person types.
                client_id:
                  type: string
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/OAuthError'
        '404':
          $ref: '#/components/responses/OAuthError'
        '409':
          $ref: '#/components/responses/OAuthError'
        '410':
          $ref: '#/components/responses/OAuthError'
        '418':
          $ref: '#/components/responses/OAuthError'
        '429':
          $ref: '#/components/responses/OAuthError'
  /oauth/authorize:
    get:
      tags: [oauth]
      operationId: authorizeInBrowser
      summary: Send the person here in a browser to approve an app
      description: Tethr redirects to the website, asks which profile to log to, then sends the browser to `redirect_uri` with `code` and `state`. Use PKCE (`S256`) for apps that can't keep a secret.
      parameters:
        - {name: response_type, in: query, required: true, schema: {type: string, enum: [code]}}
        - {name: client_id, in: query, required: true, schema: {type: string}}
        - {name: redirect_uri, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: code_challenge, in: query, schema: {type: string}}
        - {name: code_challenge_method, in: query, schema: {type: string, enum: [S256]}}
      responses:
        '302':
          description: On to the website
  /oauth/token:
    post:
      tags: [oauth]
      operationId: exchangeToken
      summary: Swap an authorisation code or refresh token for new tokens
      description: Refreshing replaces both tokens; the old refresh token stops working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                client_id:
                  type: string
                client_secret:
                  type: string
                code:
                  type: string
                redirect_uri:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/OAuthError'
        '401':
          $ref: '#/components/responses/OAuthError'
  /oauth/revoke:
    post:
      tags: [oauth]
      operationId: revokeToken
      summary: Sign an app out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, client_id]
              properties:
                token:
                  type: string
                client_id:
                  type: string
      responses:
        '200':
          description: Revoked
components:
  parameters:
    DeviceCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProfileId:
      name: profile_id
      in: query
      description: With a session, which profile in the household to use. Left out, it's the owner's. Ignored with an access token, which always uses the profile it was granted for.
      schema:
        type: integer
        format: int64
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: tethr_session
    bearer:
      type: http
      scheme: bearer
      description: An access token from `/oauth/device/token` or `/oauth/token`.
  responses:
    OAuthError:
      description: OAuth's error shape
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
              error_description:
                type: string
    Problem:
      description: Something went wrong; `code` says what
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SignUp:
      type: object
      required: [email, name, username]
      properties:
        email:
          type: string
        name:
          type: string
        username:
          type: string
          description: 2 to 24 lowercase letters, numbers and dashes, starting with a letter or number.
        invite:
          type: string
          description: Needed while sign-ups are invite-only.
    EmailLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    Verification:
      type: object
      description: Either `token` from the link, or `email` and `code` from the email.
      properties:
        token:
          type: string
        email:
          type: string
        code:
          type: string
    Me:
      type: object
      required: [account, profiles]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
    Account:
      type: object
      required: [id, email, name, created_at]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
    Profile:
      type: object
      required: [id, username, name, kind, private]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [owner, person, kids, guest]
        private:
          type: boolean
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: username_taken
        message:
          type: string
    NewProfile:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [person, kids, guest]
        username:
          type: string
          description: Left out, one is made from the owner's username and the name.
    ProfileChanges:
      type: object
      properties:
        name:
          type: string
        username:
          type: string
        private:
          type: boolean
    Session:
      type: object
      required: [id, created_at, last_seen_at, current]
      properties:
        id:
          type: integer
          format: int64
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        current:
          type: boolean
    Passkey:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    PasskeyOptions:
      type: object
      required: [challenge, options]
      properties:
        challenge:
          type: string
          description: Send this back with the browser's response.
        options:
          type: object
          additionalProperties: true
          description: WebAuthn options in their JSON form.
    PasskeyResponse:
      type: object
      required: [challenge, credential]
      properties:
        challenge:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: The browser's WebAuthn response in its JSON form.
        name:
          type: string
          description: A name for a new passkey, such as "iCloud Keychain".
    Device:
      type: object
      required: [code, app_name]
      properties:
        code:
          type: string
        app_name:
          type: string
    ProfileChoice:
      type: object
      required: [profile_id]
      properties:
        profile_id:
          type: integer
          format: int64
    AuthorizingApp:
      type: object
      required: [app_name]
      properties:
        app_name:
          type: string
    AuthorizationRequest:
      type: object
      required: [client_id, redirect_uri, profile_id]
      properties:
        client_id:
          type: string
        redirect_uri:
          type: string
        profile_id:
          type: integer
          format: int64
        state:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
    AuthorizationRedirect:
      type: object
      required: [redirect_to]
      properties:
        redirect_to:
          type: string
    Connection:
      type: object
      required: [id, app_name, profile_id, profile_name, created_at]
      properties:
        id:
          type: integer
          format: int64
        app_name:
          type: string
        profile_id:
          type: integer
          format: int64
        profile_name:
          type: string
        label:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    ConnectionChanges:
      type: object
      required: [label]
      properties:
        label:
          type: string
    DeviceSignIn:
      type: object
      required: [device_code, user_code, verification_url, expires_in, interval]
      properties:
        device_code:
          type: string
        user_code:
          type: string
        verification_url:
          type: string
        expires_in:
          type: integer
        interval:
          type: integer
    Tokens:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope, created_at]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          description: Seconds until the access token runs out.
        refresh_token:
          type: string
        scope:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix seconds.
    Ids:
      type: object
      description: Send whichever IDs you have. Tethr matches on `tethr` first, then TMDB, IMDb and TVDB.
      properties:
        tethr:
          type: integer
          format: int64
        tmdb:
          type: integer
        imdb:
          type: string
        tvdb:
          type: integer
    ItemRef:
      type: object
      description: A film or show by its IDs, a season by its show and `season`, or an episode by its own IDs or its show, `season` and `number`.
      required: [type]
      properties:
        type:
          type: string
          enum: [movie, show, season, episode]
        ids:
          $ref: '#/components/schemas/Ids'
        show:
          $ref: '#/components/schemas/Ids'
        season:
          type: integer
        number:
          type: integer
    Title:
      type: object
      required: [ids]
      properties:
        ids:
          $ref: '#/components/schemas/Ids'
        name:
          type: string
          description: The English title, from Wikidata. Usually there within a minute of Tethr first seeing the title, but missing for anything Wikidata doesn't have. Fetch artwork and anything else from TMDB yourself.
        original_name:
          type: string
          description: The title in its original language, from Wikidata.
        year:
          type: integer
          description: The year of first release or broadcast, from Wikidata.
    Episode:
      type: object
      required: [ids, season, number]
      properties:
        ids:
          $ref: '#/components/schemas/Ids'
        season:
          type: integer
        number:
          type: integer
        first_aired:
          type: string
          format: date
    Item:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [movie, show, season, episode]
        title:
          $ref: '#/components/schemas/Title'
        season:
          type: integer
          description: For a season.
        episode:
          $ref: '#/components/schemas/Episode'
    ScrobbleRequest:
      type: object
      required: [event, progress, item]
      properties:
        event:
          type: string
          enum: [start, pause, stop]
        progress:
          type: number
          format: double
          description: Percent watched, 0 to 100.
        duration_seconds:
          type: number
          format: double
          description: The file's length, if you know it.
        item:
          $ref: '#/components/schemas/ItemRef'
    ScrobbleResult:
      type: object
      required: [result, progress, item]
      properties:
        result:
          type: string
          enum: [watching, paused, watched]
        id:
          type: integer
          format: int64
          description: The resume point's ID when paused, or the watch's ID when watched.
        progress:
          type: number
          format: double
        item:
          $ref: '#/components/schemas/Item'
    Watch:
      type: object
      required: [id, watched_at, action, item]
      properties:
        id:
          type: integer
          format: int64
        watched_at:
          type: string
          format: date-time
        action:
          type: string
          enum: [scrobble, checkin, watch]
        item:
          $ref: '#/components/schemas/Item'
    HistoryPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Watch'
        total:
          type: integer
          format: int64
        page:
          type: integer
        limit:
          type: integer
    NewWatches:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [item]
            properties:
              item:
                $ref: '#/components/schemas/ItemRef'
              watched_at:
                type: string
                format: date-time
                description: Left out, it's now.
    NewListings:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [item]
            properties:
              item:
                $ref: '#/components/schemas/ItemRef'
              notes:
                type: string
    SyncResult:
      type: object
      required: [added, existing, not_found]
      properties:
        added:
          type: integer
        existing:
          type: integer
        not_found:
          type: array
          items:
            $ref: '#/components/schemas/ItemRef'
    ResumePoint:
      type: object
      required: [id, progress, paused_at, item]
      properties:
        id:
          type: integer
          format: int64
        progress:
          type: number
          format: double
        paused_at:
          type: string
          format: date-time
        item:
          $ref: '#/components/schemas/Item'
    Listing:
      type: object
      required: [id, rank, listed_at, item]
      properties:
        id:
          type: integer
          format: int64
        rank:
          type: integer
        listed_at:
          type: string
          format: date-time
        notes:
          type: string
        item:
          $ref: '#/components/schemas/Item'
    Activity:
      type: object
      required: [latest, history, playback, watchlist, ratings]
      properties:
        latest:
          type: string
          format: date-time
        history:
          type: string
          format: date-time
        playback:
          type: string
          format: date-time
        watchlist:
          type: string
          format: date-time
        ratings:
          type: string
          format: date-time
    DeveloperApp:
      type: object
      required: [id, name, client_id, redirect_uris, connections, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        client_id:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        connections:
          type: integer
          format: int64
          description: Profiles connected to it right now.
        created_at:
          type: string
          format: date-time
    NewApp:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Shown to people when they connect it. Up to 60 characters.
        redirect_uris:
          type: array
          description: Where browser sign-in returns to. https, a custom scheme like `myplayer://callback`, or http on localhost.
          items:
            type: string
    AppChanges:
      type: object
      properties:
        name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
    RegisteredApp:
      type: object
      required: [app, client_secret]
      properties:
        app:
          $ref: '#/components/schemas/DeveloperApp'
        client_secret:
          type: string
    AppSecret:
      type: object
      required: [client_secret]
      properties:
        client_secret:
          type: string
    UpNextEntry:
      type: object
      required: [show, next, last_watched_at, aired, watched]
      properties:
        show:
          $ref: '#/components/schemas/Title'
        next:
          $ref: '#/components/schemas/Episode'
        last_watched_at:
          type: string
          format: date-time
        aired:
          type: integer
          description: Episodes aired so far, not counting specials.
        watched:
          type: integer
          description: How many of those have been watched.
        resume:
          $ref: '#/components/schemas/Resume'
    Resume:
      type: object
      description: Where the next episode was paused, if it was started.
      required: [id, progress]
      properties:
        id:
          type: integer
          format: int64
        progress:
          type: number
          format: double
    Rating:
      type: object
      required: [id, rating, rated_at, item]
      properties:
        id:
          type: integer
          format: int64
        rating:
          type: integer
          minimum: 1
          maximum: 10
        rated_at:
          type: string
          format: date-time
        item:
          $ref: '#/components/schemas/Item'
    NewRatings:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [item, rating]
            properties:
              item:
                $ref: '#/components/schemas/ItemRef'
              rating:
                type: integer
                minimum: 1
                maximum: 10
              rated_at:
                type: string
                format: date-time
                description: Left out, it's now.
    Import:
      type: object
      required: [id, source, filename, status, summary, created_at]
      properties:
        id:
          type: integer
          format: int64
        source:
          type: string
          enum: [trakt]
        filename:
          type: string
        status:
          type: string
          enum: [parsed, queued, applied, failed, undone]
        summary:
          $ref: '#/components/schemas/ImportSummary'
        created_at:
          type: string
          format: date-time
        applied_at:
          type: string
          format: date-time
        undone_at:
          type: string
          format: date-time
    ImportSummary:
      type: object
      required: [history, watchlist, playback, ratings, hidden, unmatched]
      properties:
        history:
          $ref: '#/components/schemas/ImportCount'
        watchlist:
          $ref: '#/components/schemas/ImportCount'
        playback:
          $ref: '#/components/schemas/ImportCount'
        ratings:
          $ref: '#/components/schemas/ImportCount'
        hidden:
          $ref: '#/components/schemas/ImportCount'
        unmatched:
          type: array
          description: Up to 100 of the items that couldn't be matched, as the file names them.
          items:
            type: string
    ImportCount:
      type: object
      required: [total, added, skipped, unmatched]
      description: Added and skipped are filled in once the import is applied. Skipped items were already there.
      properties:
        total:
          type: integer
        added:
          type: integer
        skipped:
          type: integer
        unmatched:
          type: integer
