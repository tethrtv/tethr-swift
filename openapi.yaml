openapi: 3.0.3
info:
  title: Tethr API
  version: 0.1.0
  description: |
    Tethr's own API: accounts, households and, soon, everything players need to log what people watch.

    Signing in works without passwords. Ask for a sign-in email, then exchange the link's token, or the email address and the 6-digit code, for a session. The session lives in an HTTP-only cookie, so browsers send it with `credentials: 'include'`.

    Errors come back as `{"code": "...", "message": "..."}`. `code` is stable for programs to check, and `message` is written for people.

    Every endpoint is rate limited. Signed-in calls count against the account, whichever profile, app or browser makes them: 1000 reads every 5 minutes, and writes at 1 a second with bursts of up to 10. Calls without sign-in count against the address they come from: 1000 reads every 5 minutes and 20 writes a minute. Over a limit, the answer is 429 with the code `rate_limited`, a `Retry-After` header in seconds, and an `X-Ratelimit` header holding JSON with the limit's `name`, `period`, `limit`, `remaining` and `until`. The Trakt-compatible paths share the same limits.

    Apps sign in on someone's behalf with OAuth: TVs show a code that people enter at `/activate` on the website, and phones and computers send them to `/oauth/authorize` in a browser. Each connection logs to one profile the person chooses. Send the access token as `Authorization: Bearer ...` to the tracking endpoints: scrobble, Up next, history, playback, the watchlist, ratings, imports and activity.

    Players built for the Trakt API can use the paths they already know instead, at the same address.
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: https://api.tethr.tv
  - url: https://staging-api.tethr.tv
paths:
  /v1/accounts:
    post:
      operationId: createAccount
      summary: Start a sign-up by emailing a sign-in link
      description: Always answers 202 for an email address that already has an account, so the endpoint can't be used to find out who has signed up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUp'
      responses:
        '202':
          description: A sign-in link and code are on their way
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/email-link:
    post:
      operationId: requestEmailLink
      summary: Email a sign-in link and code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailLinkRequest'
      responses:
        '202':
          description: If the address has an account, a sign-in link and code are on their way
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/verify:
    post:
      operationId: verify
      summary: Exchange a link token, or an email and code, for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verification'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/auth/sign-out:
    post:
      operationId: signOut
      summary: End the current session
      responses:
        '204':
          description: Signed out
          headers:
            Set-Cookie:
              schema:
                type: string
  /v1/auth/passkey/options:
    post:
      operationId: passkeySignInOptions
      summary: Start signing in with a passkey
      responses:
        '200':
          description: Options to pass to the browser's WebAuthn API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
  /v1/auth/passkey:
    post:
      operationId: passkeySignIn
      summary: Finish signing in with a passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Problem'
  /v1/passkeys:
    get:
      operationId: listPasskeys
      summary: The signed-in account's passkeys
      security:
        - session: []
      responses:
        '200':
          description: Passkeys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Passkey'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: addPasskey
      summary: Finish adding a passkey
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/passkeys/options:
    post:
      operationId: addPasskeyOptions
      summary: Start adding a passkey
      security:
        - session: []
      responses:
        '200':
          description: Options to pass to the browser's WebAuthn API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/passkeys/{id}:
    delete:
      operationId: removePasskey
      summary: Remove a passkey
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/profiles:
    post:
      operationId: addProfile
      summary: Add someone to the household
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProfile'
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/profiles/{id}:
    patch:
      operationId: updateProfile
      summary: Rename a profile, change its username or privacy
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileChanges'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeProfile
      summary: Remove someone from the household, and their history
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/invites:
    get:
      operationId: listInvites
      summary: Your invites
      description: While sign-ups are invite-only, each account can make three invites to share. `open` is true when anyone can sign up, so there's nothing to share.
      security:
        - session: []
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invites'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: makeInvite
      summary: Make an invite to share
      description: Each code works once. The person who uses it sees your username when they sign up.
      security:
        - session: []
      responses:
        '201':
          description: Made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/invites/{code}:
    get:
      operationId: checkInvite
      summary: Check an invite code
      description: Whether a code can still be used, and the username of the person who made it. Anyone can ask.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCheck'
  /v1/sessions:
    get:
      operationId: listSessions
      summary: Where the account is signed in
      security:
        - session: []
      responses:
        '200':
          description: Sessions, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/sessions/{id}:
    delete:
      operationId: endSession
      summary: Sign out one device
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/sessions/sign-out-others:
    post:
      operationId: signOutOthers
      summary: Sign out everywhere except here
      security:
        - session: []
      responses:
        '204':
          description: Signed out elsewhere
        '401':
          $ref: '#/components/responses/Problem'
  /v1/me:
    delete:
      operationId: deleteAccount
      summary: Delete the account, its household and everything in it
      description: Send the owner's username to confirm. This can't be undone.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        '204':
          description: Deleted
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    get:
      operationId: getMe
      summary: The signed-in account and its household's profiles
      security:
        - session: []
      responses:
        '200':
          description: The signed-in account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/export:
    get:
      operationId: exportData
      summary: Everything in your household, as a zip
      description: The zip holds `tethr.json`, shaped like the `Export` schema, and `history.csv`. Only a session that signed in within the last 10 minutes can export, twice a day per account, and every export is emailed to the account. Access tokens can't export.
      security:
        - session: []
      responses:
        '200':
          description: The zip
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/devices/{code}:
    get:
      operationId: getDevice
      summary: Look up a code shown on a TV or other device
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/DeviceCode'
      responses:
        '200':
          description: The code is waiting for approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/devices/{code}/approve:
    post:
      operationId: approveDevice
      summary: Connect the device to one of your profiles
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/DeviceCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileChoice'
      responses:
        '204':
          description: Approved; the device picks up its tokens on its next poll
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/devices/{code}/deny:
    post:
      operationId: denyDevice
      summary: Turn the device away
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/DeviceCode'
      responses:
        '204':
          description: Denied
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/authorize:
    get:
      operationId: getAuthorization
      summary: Check an app's sign-in request before asking the person
      security:
        - session: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The app and redirect are known
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizingApp'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: authorize
      summary: Approve an app's sign-in request for one of your profiles
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
      responses:
        '200':
          description: Send the browser to `redirect_to`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationRedirect'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/connections:
    get:
      operationId: listConnections
      summary: List the apps connected to your household
      security:
        - session: []
      responses:
        '200':
          description: Connected apps, most recently used first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/connections/{id}:
    patch:
      operationId: renameConnection
      summary: Give a connected app a name, like "Living room"
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionChanges'
      responses:
        '204':
          description: Renamed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: disconnect
      summary: Disconnect an app
      description: Its tokens stop working at once. History it logged stays.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Disconnected
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/profile:
    get:
      operationId: getProfile
      summary: The profile you're logging to
      security:
        - session: []
        - bearer: []
      responses:
        '200':
          description: For an app, the profile it was connected to. For the website, your own.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/scrobble:
    post:
      operationId: scrobble
      summary: Report playback starting, pausing or stopping
      description: Send `start` when playback begins or resumes, `pause` when it pauses, and `stop` when it ends. A stop at 80% or more logs a watch and clears the resume point; a stop below that keeps a resume point instead.
      security:
        - session: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrobbleRequest'
      responses:
        '200':
          description: What Tethr did with it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrobbleResult'
        '401':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/history:
    get:
      operationId: listHistory
      summary: Watches, newest first
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, episode]
        - name: title_id
          in: query
          description: Only watches of this film or show.
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        '200':
          description: A page of watches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: addHistory
      summary: Log watches that happened elsewhere
      description: Films and episodes only. A watch already logged for the same item at the same time is skipped.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWatches'
      responses:
        '200':
          description: What was added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '401':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/history/{id}:
    delete:
      operationId: removeWatch
      summary: Remove one watch
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/playback:
    get:
      operationId: listPlayback
      summary: Resume points, most recent first
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, episode]
      responses:
        '200':
          description: Resume points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResumePoint'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/playback/{id}:
    delete:
      operationId: removePlayback
      summary: Forget a resume point
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/watchlist:
    get:
      operationId: listWatchlist
      summary: The watchlist, in order
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, show, season, episode]
      responses:
        '200':
          description: Watchlist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: addToWatchlist
      summary: Add to the watchlist
      description: Watching a film or episode takes it off the watchlist by itself.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewListings'
      responses:
        '200':
          description: What was added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '401':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/watchlist/{id}:
    delete:
      operationId: removeFromWatchlist
      summary: Take one entry off the watchlist
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/auto-lists:
    get:
      operationId: listAutoLists
      summary: Lists made from your own data
      description: Lists that fill themselves from the profile's history and ratings. Only the profile can read them. The household list is left out until at least two profiles in the household count towards it.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutoList'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/auto-lists/{kind}:
    get:
      operationId: listAutoListItems
      summary: What's on a list made from your own data
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - name: kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AutoListKind'
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, show]
        - name: sort_by
          in: query
          description: Left out, the list's own order.
          schema:
            $ref: '#/components/schemas/ListSortBy'
        - name: sort_how
          in: query
          schema:
            $ref: '#/components/schemas/ListSortHow'
        - name: hide_watched
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          description: 100 by default, and up to 1,000.
          schema:
            type: integer
      responses:
        '200':
          description: The list and a page of its items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoListItemsPage'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
