        '404':
          $ref: '#/components/responses/Problem'
  /v1/titles/{id}/episode-order:
    put:
      operationId: pickEpisodeOrder
      summary: Follow one of the show's TMDB episode groups instead of aired order
      description: Up next, progress and the show's seasons then follow the group, for this profile only. Episodes the group leaves out don't count towards progress, but stay in history. List a show's groups with TMDB's `/tv/{id}/episode_groups`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpisodeOrderChoice'
      responses:
        '204':
          description: The show follows the group
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: useAiredOrder
      summary: Go back to aired order for a show
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The show is in aired order
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/search:
    get:
      operationId: search
      summary: Search the films and shows you've watched, rated or listed
      description: Matches English and original names. Names that start with the words come first. Up to 20 results.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, show]
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/ratings:
    get:
      operationId: listRatings
      summary: Ratings, newest first
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, show, season, episode]
        - name: rating
          in: query
          description: Only these ratings.
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 10
          explode: false
      responses:
        '200':
          description: Ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rating'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: rate
      summary: Rate films, shows, seasons or episodes from 1 to 10
      description: Rating something again replaces the old rating. The same score again counts as existing.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRatings'
      responses:
        '200':
          description: What was rated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '401':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/ratings/{id}:
    delete:
      operationId: removeRating
      summary: Remove one rating
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/imports:
    get:
      operationId: listImports
      summary: The last 20 imports
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Imports, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Import'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createImport
      summary: Read a Trakt export or Simkl backup before importing it
      description: |
        Send the zip from Trakt's data export, or the zip from Simkl's "Download backup", as the body. Tethr reads history, the watchlist, resume points, ratings and hidden items, and keeps them for 24 hours. Nothing is written until the import is applied, so check the counts and the unmatched list first. Everything else in the zip is ignored.

        Items are matched by their TMDB, IMDb and TVDB IDs. Anything without one of those is listed as unmatched rather than guessed. Simkl lists anime by its own seasons with anime-site IDs only, so anime episodes are listed as unmatched. Plays already in history at the same time are skipped, so importing the same file twice is safe.

        Exports without IDs, like Letterboxd's, are matched first and sent as JSON instead, which is how the website does it. Items without a `tmdb` ID are listed as unmatched.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
        - name: filename
          in: query
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              $ref: '#/components/schemas/NewImport'
      responses:
        '201':
          description: The import, ready to apply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
  /v1/imports/{id}:
    get:
      operationId: getImport
      summary: One import and its counts
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: The import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/imports/{id}/apply:
    post:
      operationId: applyImport
      summary: Write an import into the profile
      description: Imports run in the background, one at a time. Poll the import until its status is `applied` or `failed`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/imports/{id}/undo:
    post:
      operationId: undoImport
      summary: Take out everything an import added
      description: Works for 30 days after an import is applied. Plays, ratings and watchlist entries that were already there before the import stay.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Undone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/media-servers:
    get:
      operationId: listMediaServers
      summary: Media servers that send your household's plays
      description: Each server lists the users it has sent plays for. A user's plays are logged to the profile they're matched to. Until then their finished plays are kept for a week, and logged once they're matched.
      security:
        - session: []
      responses:
        '200':
          description: Your media servers, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaServer'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: addMediaServer
      summary: Get a webhook address for a media server
      description: The address comes back once, as a path to add to the API's own address. On Jellyfin, add it as a Generic destination in the Webhook plugin with Send All Properties ticked, for Playback Start, Playback Stop and User Data Saved. On Plex, which needs Plex Pass, add it under Webhooks in the account settings. On Emby, which needs Emby Premiere, add it as a webhook for playback and mark played events. Webhooks are limited to 600 a minute per server.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMediaServer'
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddedMediaServer'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /v1/media-servers/{id}:
    delete:
      operationId: removeMediaServer
      summary: Stop taking plays from a media server
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/media-servers/{id}/address:
    post:
      operationId: newMediaServerAddress
      summary: Replace a media server's webhook address
      description: The old address stops working straight away.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The new address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaServerAddress'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/media-servers/{id}/users/{user}:
    put:
      operationId: matchServerUser
      summary: Choose which profile a media server user's plays go to
      description: Plays kept while the user wasn't matched are logged to the profile. Send a `profile_id` of null to stop logging their plays.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: user
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerUserMatch'
      responses:
        '204':
          description: Matched
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/apps:
    get:
      operationId: listApps
      summary: Apps you've registered
      security:
        - session: []
      responses:
        '200':
          description: Your apps, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeveloperApp'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: registerApp
      summary: Register an app to get a client ID
      description: The secret comes back once. Leave out `redirect_uris` for apps that only sign in with TV codes.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewApp'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredApp'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/apps/{id}:
    patch:
      operationId: updateApp
      summary: Rename an app or change where sign-in returns to
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppChanges'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperApp'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: revokeApp
      summary: Revoke an app
      description: Everyone signed in with it is signed out, and its client ID stops working. History it logged stays.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/apps/{id}/secret:
    post:
      operationId: newAppSecret
      summary: Replace an app's secret
      description: The old secret stops working at once. People stay signed in.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The new secret, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSecret'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /oauth/device/code:
    post:
      tags: [oauth]
      operationId: startDeviceSignIn
      summary: Start signing in a TV or other device
      description: Show `user_code` and `verification_url` to the person, then poll `/oauth/device/token` every `interval` seconds. Errors from the `/oauth` endpoints use OAuth's shape, with `error` and `error_description`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id:
                  type: string
      responses:
        '200':
          description: A code to show
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSignIn'
        '403':
          $ref: '#/components/responses/OAuthError'
  /oauth/device/token:
    post:
      tags: [oauth]
      operationId: pollDeviceSignIn
      summary: Check whether the code has been approved
      description: 400 means keep waiting, 429 means slow down, 404 the code is unknown, 409 it's been used, 410 it's expired and 418 it was denied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, client_id]
              properties:
                code:
                  type: string
                  description: The `device_code`, not the code the person types.
                client_id:
                  type: string
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/OAuthError'
        '404':
          $ref: '#/components/responses/OAuthError'
        '409':
          $ref: '#/components/responses/OAuthError'
        '410':
          $ref: '#/components/responses/OAuthError'
        '418':
          $ref: '#/components/responses/OAuthError'
        '429':
          $ref: '#/components/responses/OAuthError'
  /oauth/authorize:
    get:
      tags: [oauth]
      operationId: authorizeInBrowser
      summary: Send the person here in a browser to approve an app
      description: Tethr redirects to the website, asks which profile to log to, then sends the browser to `redirect_uri` with `code` and `state`. Use PKCE (`S256`) for apps that can't keep a secret.
      parameters:
        - {name: response_type, in: query, required: true, schema: {type: string, enum: [code]}}
        - {name: client_id, in: query, required: true, schema: {type: string}}
        - {name: redirect_uri, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: code_challenge, in: query, schema: {type: string}}
        - {name: code_challenge_method, in: query, schema: {type: string, enum: [S256]}}
      responses:
        '302':
          description: On to the website
  /oauth/token:
    post:
      tags: [oauth]
      operationId: exchangeToken
      summary: Swap an authorisation code or refresh token for new tokens
      description: Refreshing replaces both tokens; the old refresh token stops working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                client_id:
                  type: string
                client_secret:
                  type: string
                code:
                  type: string
                redirect_uri:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/OAuthError'
        '401':
          $ref: '#/components/responses/OAuthError'
  /oauth/revoke:
    post:
      tags: [oauth]
      operationId: revokeToken
      summary: Sign an app out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, client_id]
              properties:
                token:
                  type: string
                client_id:
                  type: string
      responses:
        '200':
          description: Revoked
components:
  parameters:
    DeviceCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ItemId:
      name: item
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
    ProfileId:
      name: profile_id
      in: query
      description: With a session, which profile in the household to use. Left out, it's the owner's. Ignored with an access token, which always uses the profile it was granted for.
      schema:
        type: integer
        format: int64
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: tethr_session
    bearer:
      type: http
      scheme: bearer
      description: An access token from `/oauth/device/token` or `/oauth/token`.
  responses:
    OAuthError:
      description: OAuth's error shape
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
              error_description:
                type: string
    Problem:
      description: Something went wrong; `code` says what
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SignUp:
      type: object
      required: [email, name, username]
      properties:
        email:
          type: string
        name:
          type: string
        username:
          type: string
          description: 2 to 24 lowercase letters, numbers and dashes, starting with a letter or number.
        invite:
          type: string
          description: Needed while sign-ups are invite-only.
    EmailLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    Verification:
      type: object
      description: Either `token` from the link, or `email` and `code` from the email.
      properties:
        token:
          type: string
        email:
          type: string
        code:
          type: string
    Me:
      type: object
      required: [account, profiles]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
    Account:
      type: object
      required: [id, email, name, created_at]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
    Profile:
      type: object
      required: [id, username, name, kind, private]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [owner, person, kids, guest]
        private:
          type: boolean
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: username_taken
        message:
          type: string
    NewProfile:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [person, kids, guest]
        username:
          type: string
          description: Left out, one is made from the owner's username and the name.
    ProfileChanges:
      type: object
      properties:
        name:
          type: string
        username:
          type: string
        private:
          type: boolean
    Invites:
      type: object
      required: [open, paused, left, invites]
      properties:
        open:
          type: boolean
          description: Anyone can sign up, so invites aren't needed.
        paused:
          type: boolean
          description: New invites can't be made for now. Ones already made still work.
        left:
          type: integer
          description: How many more invites the account can make.
        invites:
          type: array
          description: Invites the account has made, oldest first.
          items:
            $ref: '#/components/schemas/Invite'
    Invite:
      type: object
      required: [code, url, created_at]
      properties:
        code:
          type: string
        url:
          type: string
          description: The sign-up page with the code filled in.
        created_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
        used_by:
          type: string
          description: The username of the account that used it.
    InviteCheck:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        invited_by:
          type: string
          description: The username of the person who made the invite. Left out for invites from Tethr itself.
    Session:
      type: object
      required: [id, created_at, last_seen_at, current]
      properties:
        id:
          type: integer
          format: int64
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        current:
          type: boolean
    Passkey:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    PasskeyOptions:
      type: object
      required: [challenge, options]
      properties:
        challenge:
          type: string
          description: Send this back with the browser's response.
        options:
          type: object
          additionalProperties: true
          description: WebAuthn options in their JSON form.
    PasskeyResponse:
      type: object
      required: [challenge, credential]
      properties:
        challenge:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: The browser's WebAuthn response in its JSON form.
        name:
          type: string
          description: A name for a new passkey, such as "iCloud Keychain".
    Device:
      type: object
      required: [code, app_name, official]
      properties:
        code:
          type: string
        app_name:
          type: string
        official:
          type: boolean
          description: Made by Tethr, like the plugins for media servers.
    ProfileChoice:
      type: object
      required: [profile_id]
      properties:
        profile_id:
          type: integer
          format: int64
    AuthorizingApp:
      type: object
      required: [app_name]
      properties:
        app_name:
          type: string
    AuthorizationRequest:
      type: object
      required: [client_id, redirect_uri, profile_id]
      properties:
        client_id:
          type: string
        redirect_uri:
          type: string
        profile_id:
          type: integer
          format: int64
        state:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
    AuthorizationRedirect:
      type: object
      required: [redirect_to]
      properties:
        redirect_to:
          type: string
    Connection:
      type: object
      required: [id, app_name, official, profile_id, profile_name, created_at]
      properties:
        id:
          type: integer
          format: int64
        app_name:
          type: string
        official:
          type: boolean
          description: Made by Tethr, like the plugins for media servers.
        profile_id:
          type: integer
          format: int64
        profile_name:
          type: string
        label:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    ConnectionChanges:
      type: object
      required: [label]
      properties:
        label:
          type: string
    DeviceSignIn:
      type: object
      required: [device_code, user_code, verification_url, expires_in, interval]
      properties:
        device_code:
          type: string
        user_code:
          type: string
        verification_url:
          type: string
        expires_in:
          type: integer
        interval:
          type: integer
    Tokens:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope, created_at]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          description: Seconds until the access token runs out.
        refresh_token:
          type: string
        scope:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix seconds.
    Ids:
      type: object
      description: Send whichever IDs you have. Tethr matches on `tethr` first, then TMDB, IMDb and TVDB.
      properties:
        tethr:
          type: integer
          format: int64
        tmdb:
          type: integer
        imdb:
          type: string
        tvdb:
          type: integer
    ItemRef:
      type: object
      description: A film or show by its IDs, a season by its show and `season`, or an episode by its own IDs or its show, `season` and `number`.
      required: [type]
      properties:
        type:
          type: string
          enum: [movie, show, season, episode]
        ids:
          $ref: '#/components/schemas/Ids'
        show:
          $ref: '#/components/schemas/Ids'
        season:
          type: integer
        number:
          type: integer
    Title:
      type: object
      required: [ids]
      properties:
        ids:
          $ref: '#/components/schemas/Ids'
        slug:
          type: string
          description: The name and year, such as `breaking-bad-2008`, once Wikidata has both, and `t-` with the Tethr ID until then. It doesn't change once set, and the `t-` form always works.
        name:
          type: string
          description: The English title, from Wikidata. Usually there within a minute of Tethr first seeing the title, but missing for anything Wikidata doesn't have. Fetch artwork and anything else from TMDB yourself.
        original_name:
          type: string
          description: The title in its original language, from Wikidata.
        year:
          type: integer
          description: The year of first release or broadcast, from Wikidata.
        runtime_minutes:
          type: integer
          description: From Wikidata. For a show, roughly how long an episode runs.
    Episode:
      type: object
      required: [ids, season, number]
      properties:
        ids:
          $ref: '#/components/schemas/Ids'
        season:
          type: integer
        number:
          type: integer
        first_aired:
          type: string
          format: date
        order:
          $ref: '#/components/schemas/OrderNumber'
    OrderNumber:
      type: object
      description: The episode's season and number in the episode order the profile picked for the show, when they differ from aired order.
      required: [season, number]
      properties:
        season:
          type: integer
        number:
          type: integer
    EpisodeOrderChoice:
      type: object
      required: [tmdb_group]
      properties:
        tmdb_group:
          type: string
          description: The TMDB episode group ID.
    Item:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [movie, show, season, episode]
        title:
          $ref: '#/components/schemas/Title'
        season:
          type: integer
          description: For a season.
        episode:
          $ref: '#/components/schemas/Episode'
    ScrobbleRequest:
      type: object
      required: [event, progress, item]
      properties:
        event:
          type: string
          enum: [start, pause, stop]
        progress:
          type: number
          format: double
          description: Percent watched, 0 to 100.
        duration_seconds:
          type: number
          format: double
          description: The file's length, if you know it.
        item:
          $ref: '#/components/schemas/ItemRef'
    ScrobbleResult:
      type: object
      required: [result, progress, item]
      properties:
        result:
          type: string
          enum: [watching, paused, watched]
        id:
          type: integer
          format: int64
          description: The resume point's ID when paused, or the watch's ID when watched.
        progress:
          type: number
          format: double
        item:
          $ref: '#/components/schemas/Item'
    Watch:
      type: object
      required: [id, watched_at, precision, action, item]
      properties:
        id:
          type: integer
          format: int64
        watched_at:
          type: string
          format: date-time
        precision:
          type: string
          enum: [time, day, none]
          description: How much of `watched_at` is known. With `day` only the date is, and its time is noon UTC. With `none` it was seen at some point nobody recorded, and `watched_at` is 1970-01-01.
        action:
          type: string
          enum: [scrobble, checkin, watch]
        item:
          $ref: '#/components/schemas/Item'
    HistoryPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Watch'
        total:
          type: integer
          format: int64
        page:
          type: integer
        limit:
          type: integer
    NewWatches:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [item]
            properties:
              item:
                $ref: '#/components/schemas/ItemRef'
              watched_at:
                type: string
                format: date-time
                description: Left out, it's now.
    NewListings:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [item]
            properties:
              item:
                $ref: '#/components/schemas/ItemRef'
              notes:
                type: string
    SyncResult:
      type: object
      required: [added, existing, not_found]
      properties:
        added:
          type: integer
        existing:
          type: integer
        not_found:
          type: array
          items:
            $ref: '#/components/schemas/ItemRef'
    ResumePoint:
      type: object
      required: [id, progress, paused_at, item]
      properties:
        id:
          type: integer
          format: int64
        progress:
          type: number
          format: double
        paused_at:
          type: string
          format: date-time
        item:
          $ref: '#/components/schemas/Item'
    Listing:
      type: object
      required: [id, rank, listed_at, item]
      properties:
        id:
          type: integer
          format: int64
        rank:
          type: integer
        listed_at:
          type: string
          format: date-time
        notes:
          type: string
        item:
          $ref: '#/components/schemas/Item'
    ListSortBy:
      type: string
      enum: [rank, added, title, year]
    ListSortHow:
      type: string
      enum: [asc, desc]
    ListPrivacy:
      type: string
      description: '`household` lets every profile in the household read it. `public` lets anyone with the link.'
      enum: [private, household, public]
    List:
      type: object
      required: [id, name, slug, privacy, sort_by, sort_how, owner, access, can_edit_items, in_up_next, following, follower_count, item_count, cover, url, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
          description: Made from the name, and changes with it.
        description:
          type: string
        privacy:
          $ref: '#/components/schemas/ListPrivacy'
        sort_by:
          $ref: '#/components/schemas/ListSortBy'
        sort_how:
          $ref: '#/components/schemas/ListSortHow'
        owner:
          $ref: '#/components/schemas/ListOwner'
        access:
          type: string
          description: Why you can see it. `mine` is your own list, `household` another profile's in your household, and `public` anyone else's.
          enum: [mine, household, public]
        can_edit_items:
          type: boolean
          description: Whether the profile reading it can add, remove, reorder and note items. Other profiles in the household can on household lists, and on public ones unless they're kids or guest profiles. Only the owner changes the list's details.
        in_up_next:
          type: boolean
          description: Whether the profile reading it watches the list in order in Up next.
        following:
          type: boolean
          description: Whether the profile reading it follows the list.
        follower_count:
          type: integer
          format: int64
        item_count:
          type: integer
          format: int64
        watched_count:
          type: integer
          format: int64
          description: How many items the profile reading the list has finished. Left out when signed out.
        cover_item_id:
          type: integer
          format: int64
          description: The item picked as the list's cover. Left out when none is picked.
        cover:
          type: array
          description: The picked cover item, or the first four items in list order when none is picked. Fetch their posters from TMDB.
          items:
            $ref: '#/components/schemas/Item'
        url:
          type: string
          description: The list's page on the website, made from its owner's username and its slug.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Changes when the list's details change, when items are added, removed, reordered or given notes, and when a title or episode on it is merged with another. An app can keep a copy and only fetch the items of lists that have moved on. Your watched progress, a title's name or year, and an episode's number can change without it.
    ListOwner:
      type: object
      required: [username, official]
      properties:
        username:
          type: string
        official:
          type: boolean
          description: The list is made by Tethr itself.
        name:
          type: string
          description: Left out when the owner's profile is private and you're outside their household.
    Follower:
      type: object
      required: [username, followed_at]
      properties:
        username:
          type: string
        name:
          type: string
          description: Left out when the follower's profile is private.
        followed_at:
          type: string
          format: date-time
    NewReport:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: "`illegal` for anything against the law, `harassment` for threats or abuse, `personal` for someone's private details, `spam` for adverts or scams."
          enum: [illegal, harassment, personal, spam, other]
        note:
          type: string
          description: Anything that helps, up to 500 characters.
    ListsPage:
      type: object
      required: [lists, total, page, limit]
      properties:
        lists:
          type: array
          items:
            $ref: '#/components/schemas/List'
        total:
          type: integer
          description: How many lists match, across every page.
        page:
          type: integer
        limit:
          type: integer
    User:
      type: object
      required: [username, private, lists]
      properties:
        username:
          type: string
        name:
          type: string
          description: Left out when the profile is private and you're outside its household.
        private:
          type: boolean
        lists:
          type: array
          description: The profile's lists that you can see.
          items:
            $ref: '#/components/schemas/List'
    NewList:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Up to 100 characters.
        description:
          type: string
          description: Up to 1,000 characters.
        privacy:
          $ref: '#/components/schemas/ListPrivacy'
        sort_by:
          $ref: '#/components/schemas/ListSortBy'
        sort_how:
          $ref: '#/components/schemas/ListSortHow'
    ListChanges:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          description: Empty clears it.
        privacy:
          $ref: '#/components/schemas/ListPrivacy'
        sort_by:
          $ref: '#/components/schemas/ListSortBy'
        sort_how:
          $ref: '#/components/schemas/ListSortHow'
        cover_item_id:
          type: integer
          format: int64
          description: An item on the list to use as its cover. 0 goes back to the first four items.
    ListItem:
      type: object
      required: [id, rank, listed_at, item]
      properties:
        id:
          type: integer
          format: int64
        rank:
          type: integer
        listed_at:
          type: string
          format: date-time
        notes:
          type: string
        item:
          $ref: '#/components/schemas/Item'
        progress:
          $ref: '#/components/schemas/ItemProgress'
    ItemProgress:
      type: object
      description: How much of the item the profile reading the list has watched. A film or episode has a total of 1, and a show or season counts aired episodes, leaving out specials for a show. Left out when signed out.
      required: [watched, total]
      properties:
        watched:
          type: integer
        total:
          type: integer
        last_watched_at:
          type: string
          format: date-time
    ListItemsPage:
      type: object
      required: [list, items, total, page, limit]
      properties:
        list:
          $ref: '#/components/schemas/List'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ListItem'
        total:
          type: integer
          description: How many items match, across every page.
        page:
          type: integer
        limit:
          type: integer
    AutoListKind:
      type: string
      description: '`stopped` is shows you started and haven''t watched for 90 days, or took out of Up next. `favourites` is films and shows you rated 9 or 10. `rewatch` is ones you rated 8 or more and last watched over a year ago. `household` is anything someone in the household rated 9 or 10, never counting guests, and counting only kids profiles when a kids profile asks.'
      enum: [stopped, favourites, rewatch, household]
    AutoList:
      type: object
      required: [kind, name, description, item_count, cover]
      properties:
        kind:
          $ref: '#/components/schemas/AutoListKind'
        name:
          type: string
        description:
          type: string
        item_count:
          type: integer
        cover:
          type: array
          description: The first four items. Fetch their posters from TMDB.
          items:
            $ref: '#/components/schemas/Item'
    AutoListItem:
      type: object
      required: [rank, at, item]
      properties:
        rank:
          type: integer
          description: Where it sits in the list's own order.
        at:
          type: string
          format: date-time
          description: Why it's on the list, which is when you last watched it, or when it was rated on the favourites lists.
        rating:
          type: integer
          description: Your own rating, if you've rated it.
        item:
          $ref: '#/components/schemas/Item'
        progress:
          $ref: '#/components/schemas/ItemProgress'
    AutoListItemsPage:
      type: object
      required: [list, items, total, page, limit]
      properties:
        list:
          $ref: '#/components/schemas/AutoList'
        items:
          type: array
          items:
            $ref: '#/components/schemas/AutoListItem'
        total:
          type: integer
          description: How many items match, across every page.
        page:
          type: integer
        limit:
          type: integer
    Activity:
      type: object
      required: [latest, history, playback, watchlist, ratings, lists]
      properties:
        latest:
          type: string
          format: date-time
        history:
          type: string
          format: date-time
        playback:
          type: string
          format: date-time
        watchlist:
          type: string
          format: date-time
        ratings:
          type: string
          format: date-time
        lists:
          type: string
          format: date-time
          description: When any list in the household last changed.
    MediaServer:
      type: object
      required: [id, kind, created_at, users]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [jellyfin, plex, emby]
        name:
          type: string
          description: The name the server gives itself, once it has sent something.
        created_at:
          type: string
          format: date-time
        last_event_at:
          type: string
          format: date-time
        users:
          type: array
          items:
            $ref: '#/components/schemas/MediaServerUser'
    MediaServerUser:
      type: object
      required: [id, name, ignored, held_plays, last_event_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        profile_id:
          type: integer
          format: int64
          description: Left out until the user is matched to a profile.
        ignored:
          type: boolean
          description: Set not to log their plays.
        held_plays:
          type: integer
          description: Plays finished before the user was matched. They're logged when the user is matched, and dropped after a week or when the user is set not to log.
        last_event_at:
          type: string
          format: date-time
    NewMediaServer:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [jellyfin, plex, emby]
    AddedMediaServer:
      type: object
      required: [server, path]
      properties:
        server:
          $ref: '#/components/schemas/MediaServer'
        path:
          type: string
          description: Add it to the API's address, like `https://api.tethr.tv/hooks/jellyfin/...`.
    MediaServerAddress:
      type: object
      required: [path]
      properties:
        path:
          type: string
    ServerUserMatch:
      type: object
      required: [profile_id]
      properties:
        profile_id:
          type: integer
          format: int64
          nullable: true
    DeveloperApp:
      type: object
      required: [id, name, client_id, redirect_uris, connections, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        client_id:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        connections:
          type: integer
          format: int64
          description: Profiles connected to it right now.
        created_at:
          type: string
          format: date-time
    NewApp:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Shown to people when they connect it. Up to 60 characters.
        redirect_uris:
          type: array
          description: Where browser sign-in returns to. https, a custom scheme like `myplayer://callback`, or http on localhost.
          items:
            type: string
    AppChanges:
      type: object
      properties:
        name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
    RegisteredApp:
      type: object
      required: [app, client_secret]
      properties:
        app:
          $ref: '#/components/schemas/DeveloperApp'
        client_secret:
          type: string
    AppSecret:
      type: object
      required: [client_secret]
      properties:
        client_secret:
          type: string
    UpNextEntry:
      type: object
      required: [show, next, last_watched_at, aired, watched]
      properties:
        show:
          $ref: '#/components/schemas/Title'
        next:
          $ref: '#/components/schemas/Episode'
        last_watched_at:
          type: string
          format: date-time
        aired:
          type: integer
          description: Episodes aired so far, not counting specials.
        watched:
          type: integer
          description: How many of those have been watched, since the rewatch started if there is one.
        resume:
          $ref: '#/components/schemas/Resume'
        rewatch_from:
          type: string
          format: date-time
          description: Set while you're rewatching the show. Only plays after it count towards progress.
    UpcomingEntry:
      type: object
      required: [show, episode, watchlist]
      properties:
        show:
          $ref: '#/components/schemas/Title'
        episode:
          $ref: '#/components/schemas/Episode'
        watchlist:
          type: boolean
          description: The show is on your watchlist and you haven't started it.
    UpNextListEntry:
      type: object
      required: [list, item_id, position, next]
      properties:
        list:
          $ref: '#/components/schemas/List'
        item_id:
          type: integer
          format: int64
          description: The list item that's next. For an episode of a season or show on the list, the item holding it.
        position:
          type: integer
          description: Where that item is in the list's order, counting from 1.
        next:
          $ref: '#/components/schemas/Item'
        last_watched_at:
          type: string
          format: date-time
          description: When you last watched anything on the list. Left out if you haven't yet.
        resume:
          $ref: '#/components/schemas/Resume'
    Resume:
      type: object
      description: Where it was paused, if it was started.
      required: [id, progress]
      properties:
        id:
          type: integer
          format: int64
        progress:
          type: number
          format: double
    TitleDetail:
      type: object
      required: [type, title, watches]
      properties:
        type:
          type: string
          enum: [movie, show]
        title:
          $ref: '#/components/schemas/Title'
        watches:
          type: array
          description: Plays of the film, newest first. Always empty for a show.
          items:
            $ref: '#/components/schemas/Play'
        resume:
          $ref: '#/components/schemas/Resume'
        rating:
          $ref: '#/components/schemas/TitleRating'
        listing:
          $ref: '#/components/schemas/TitleListing'
        lists:
          type: array
          description: Lists in your household that you can see and that the film or show itself is on.
          items:
            $ref: '#/components/schemas/TitleInList'
        episode_order:
          type: string
          description: The TMDB episode group the show follows for this profile. Left out, it's aired order.
        seasons:
          type: array
          description: Numbered in the show's episode order, with specials last. Episodes the order leaves out aren't listed.
          items:
            $ref: '#/components/schemas/SeasonDetail'
        rewatch_from:
          type: string
          format: date-time
          description: Set while you're rewatching the show. Only plays after it count towards progress.
    TitleRating:
      type: object
      description: Your rating of the film or show itself.
      required: [id, rating, rated_at]
      properties:
        id:
          type: integer
          format: int64
        rating:
          type: integer
        rated_at:
          type: string
          format: date-time
    TitleListing:
      type: object
      description: Set when the film or show itself is on your watchlist.
      required: [id, listed_at]
      properties:
        id:
          type: integer
          format: int64
        listed_at:
          type: string
          format: date-time
    TitleInList:
      type: object
      required: [list_id, item_id]
      properties:
        list_id:
          type: integer
          format: int64
        item_id:
          type: integer
          format: int64
    SeasonDetail:
      type: object
      required: [number, episodes]
      properties:
        number:
          type: integer
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/EpisodeDetail'
    EpisodeDetail:
      type: object
      required: [episode, watches]
      properties:
        episode:
          $ref: '#/components/schemas/Episode'
        watches:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/Play'
        resume:
          $ref: '#/components/schemas/Resume'
    Play:
      type: object
      required: [id, watched_at, precision, action]
      properties:
        id:
          type: integer
          format: int64
        watched_at:
          type: string
          format: date-time
        precision:
          type: string
          enum: [time, day, none]
          description: How much of `watched_at` is known. With `day` only the date is, and its time is noon UTC. With `none` it was seen at some point nobody recorded, and `watched_at` is 1970-01-01.
        action:
          type: string
          enum: [scrobble, checkin, watch]
    Rating:
      type: object
      required: [id, rating, rated_at, item]
      properties:
        id:
          type: integer
          format: int64
        rating:
          type: integer
          minimum: 1
          maximum: 10
        rated_at:
          type: string
          format: date-time
        item:
          $ref: '#/components/schemas/Item'
    NewRatings:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [item, rating]
            properties:
              item:
                $ref: '#/components/schemas/ItemRef'
              rating:
                type: integer
                minimum: 1
                maximum: 10
              rated_at:
                type: string
                format: date-time
                description: Left out, it's now.
    Export:
      type: object
      required: [format, version, exported_at, account, passkeys, apps, connections, media_servers, profiles]
      properties:
        format:
          type: string
          enum: [tethr]
        version:
          type: integer
        exported_at:
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/Account'
        passkeys:
          type: array
          items:
            $ref: '#/components/schemas/Passkey'
        apps:
          type: array
          description: Apps you registered as a developer.
          items:
            $ref: '#/components/schemas/DeveloperApp'
        connections:
          type: array
          description: Apps connected to profiles in the household.
          items:
            $ref: '#/components/schemas/Connection'
        media_servers:
          type: array
          description: Media servers sending plays, with who on each is matched to which profile. Their addresses aren't included.
          items:
            $ref: '#/components/schemas/MediaServer'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileExport'
    ProfileExport:
      type: object
      required: [profile, history, playback, ratings, watchlist, lists, hidden, imports]
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        history:
          type: array
          items:
            $ref: '#/components/schemas/Watch'
        playback:
          type: array
          items:
            $ref: '#/components/schemas/ResumePoint'
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/Rating'
        watchlist:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
        lists:
          type: array
          items:
            $ref: '#/components/schemas/ListExport'
        hidden:
          type: array
          items:
            $ref: '#/components/schemas/HiddenItem'
        imports:
          type: array
          items:
            $ref: '#/components/schemas/Import'
    ListExport:
      type: object
      required: [list, items]
      properties:
        list:
          $ref: '#/components/schemas/List'
        items:
          type: array
          description: In the list's own order.
          items:
            $ref: '#/components/schemas/Listing'
    HiddenItem:
      type: object
      required: [section, hidden_at, item]
      properties:
        section:
          type: string
        hidden_at:
          type: string
          format: date-time
        item:
          $ref: '#/components/schemas/Item'
    Import:
      type: object
      required: [id, source, filename, status, summary, created_at]
      properties:
        id:
          type: integer
          format: int64
        source:
          type: string
          enum: [trakt, simkl, letterboxd]
        filename:
          type: string
        status:
          type: string
          enum: [parsed, queued, applied, failed, undone]
        summary:
          $ref: '#/components/schemas/ImportSummary'
        created_at:
          type: string
          format: date-time
        applied_at:
          type: string
          format: date-time
        undone_at:
          type: string
          format: date-time
    ImportSummary:
      type: object
      required: [history, watchlist, playback, ratings, hidden, unmatched]
      properties:
        history:
          $ref: '#/components/schemas/ImportCount'
        watchlist:
          $ref: '#/components/schemas/ImportCount'
        playback:
          $ref: '#/components/schemas/ImportCount'
        ratings:
          $ref: '#/components/schemas/ImportCount'
        hidden:
          $ref: '#/components/schemas/ImportCount'
        unmatched:
          type: array
          description: Up to 100 of the items that couldn't be matched, as the file names them.
          items:
            type: string
    NewImport:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [letterboxd]
        history:
          type: array
          maxItems: 50000
          items:
            $ref: '#/components/schemas/ImportedItem'
        watchlist:
          type: array
          maxItems: 50000
          items:
            $ref: '#/components/schemas/ImportedItem'
        ratings:
          type: array
          maxItems: 50000
          items:
            $ref: '#/components/schemas/ImportedItem'
    ImportedItem:
      type: object
      required: [type, label]
      properties:
        type:
          type: string
          enum: [movie]
        tmdb:
          type: integer
          format: int32
        label:
          type: string
          maxLength: 300
          description: The name the export gave it, shown if it can't be matched.
        at:
          type: string
          format: date-time
          description: When it was watched, listed or rated. Leave it out for a play with no date.
        precision:
          type: string
          enum: [time, day]
          description: Set `day` when only the date of `at` is known.
        rating:
          type: integer
          minimum: 1
          maximum: 10
    ImportCount:
      type: object
      required: [total, added, skipped, unmatched]
      description: Added and skipped are filled in once the import is applied. Skipped items were already there.
      properties:
        total:
          type: integer
        added:
          type: integer
        skipped:
          type: integer
        unmatched:
          type: integer
